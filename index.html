<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پروژه من</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Tahoma, Arial, sans-serif;
      background: #f7f4ff;
      color: #28223a;
    }
    main {
      width: min(100%, 620px);
      padding: 36px 28px;
      text-align: center;
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 36px rgba(40, 34, 58, .10);
    }
    h1 { margin-top: 0; color: #6d42c7; }
    p { line-height: 1.9; }
    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 20px;
      background: #6d42c7;
      color: white;
      font: inherit;
      cursor: pointer;
    }
    #message { min-height: 1.8em; margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <h1>پروژه من</h1>
    <p>این یک فایل شروع ساده برای مخزن GitHub شماست.</p>
    <button id="helloButton" type="button">کلیک کن</button>
    <p id="message" aria-live="polite"></p>
  </main>
  <script>
    document.getElementById("helloButton").addEventListener("click", () => {
      document.getElementById("message").textContent = "همه‌چیز آماده است؛ حالا می‌توانی پروژه‌ات را توسعه بدهی.";
    });
  </script>
</body>
</html>
